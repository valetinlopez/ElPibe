<body class="min-h-screen flex flex-col font-body-md relative">
<!-- Background Textures -->

</div>
</div>
<!-- Password Field -->
<div class="relative group input-glow transition-all duration-300">
<label class="block font-body-sm text-on-surface-variant mb-space-1 px-space-2" for="password">
                        Contraseña
                    </label>
<div class="flex items-center bg-bg-surface-overlay border border-border-subtle rounded-lg focus-within:border-primary-container transition-colors">
<span class="material-symbols-outlined ml-space-4 text-outline" style="font-size: 20px;">lock</span>
<input class="w-full bg-transparent border-none text-text-primary placeholder:text-outline/50 px-space-3 py-space-4 focus:ring-0 font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="pr-space-4 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end mt-space-2">

<script>
        // Micro-interactions for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-primary-container');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-primary-container');
            });
        });

        // Simple button ripple-like effect/active state logic
        const primaryBtn = document.querySelector('button[type="submit"]');
        primaryBtn.addEventListener('mousedown', () => {
            primaryBtn.classList.add('scale-95');
        });
        primaryBtn.addEventListener('mouseup', () => {
            primaryBtn.classList.remove('scale-95');
        });
        primaryBtn.addEventListener('mouseleave', () => {
            primaryBtn.classList.remove('scale-95');
        });
    </script>
